<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Берген Александр - Визитка</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(145deg, #0b0b0e, #1a1a2e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .card {
            max-width: 420px;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 48px;
            padding: 36px 28px 32px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
            color: #fff;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            margin: 0 auto 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: 700;
            color: #1a1a2e;
            box-shadow: 0 0 40px rgba(255, 210, 0, 0.25);
            user-select: none;
        }

        .name {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(to right, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subname {
            font-size: 15px;
            opacity: 0.5;
            margin-top: 2px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 20px;
            border-radius: 60px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            text-decoration: none;
            transition: 0.25s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn .icon {
            font-size: 22px;
            width: 30px;
            text-align: center;
        }

        .btn .label {
            flex: 1;
            text-align: center;
        }

        .btn .badge {
            font-size: 12px;
            opacity: 0.4;
        }

        .btn-phone .icon {
            color: #34c759;
        }
        .btn-wa .icon {
            color: #25d366;
        }
        .btn-wa2 .icon {
            color: #25d366;
        }
        .btn-inst .icon {
            color: #e4405f;
        }
        .btn-kaspi .icon {
            color: #f5a623;
        }

        .btn-kaspi {
            background: rgba(245, 166, 35, 0.08);
            border-color: rgba(245, 166, 35, 0.15);
        }
        .btn-kaspi:hover {
            background: rgba(245, 166, 35, 0.18);
        }

        .qr-section {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 32px;
            padding: 22px 20px 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .qr-title {
            font-size: 14px;
            opacity: 0.5;
            margin-bottom: 14px;
            letter-spacing: 0.5px;
        }

        #qrcode {
            background: #fff;
            padding: 12px;
            border-radius: 20px;
            display: inline-block;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.4);
        }

        #qrcode img {
            display: block;
            width: 140px;
            height: 140px;
        }

        .qr-hint {
            font-size: 12px;
            opacity: 0.3;
            margin-top: 12px;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            font-size: 11px;
            opacity: 0.15;
        }

        @media (max-width: 440px) {
            .card {
                padding: 28px 18px 24px;
            }
            .name {
                font-size: 22px;
            }
            .btn {
                font-size: 14px;
                padding: 14px 16px;
            }
            #qrcode img {
                width: 120px;
                height: 120px;
            }
        }
    </style>
</head>
<body>

    <div class="card">

        <div class="header">
            <div class="avatar">А</div>
            <div class="name">БЕРГЕН АЛЕКСАНДР</div>
            <div class="subname">Евгеньевич</div>
        </div>

        <div class="btn-group">

            <a href="tel:+77714371241" class="btn btn-phone">
                <span class="icon">📞</span>
                <span class="label">Позвонить</span>
                <span class="badge">+7 771 437 1241</span>
            </a>

            <a href="https://wa.me/77714371241" target="_blank" class="btn btn-wa">
                <span class="icon">💬</span>
                <span class="label">WhatsApp</span>
                <span class="badge">+7 771 437 1241</span>
            </a>

            <a href="https://wa.me/77754584364" target="_blank" class="btn btn-wa2">
                <span class="icon">📱</span>
                <span class="label">WhatsApp (доп.)</span>
                <span class="badge">+7 775 458 4364</span>
            </a>

            <a href="https://instagram.com/_b.a.e_01" target="_blank" class="btn btn-inst">
                <span class="icon">📷</span>
                <span class="label">Instagram</span>
                <span class="badge">@_b.a.e_01</span>
            </a>

            <a href="https://kaspi.kz" target="_blank" class="btn btn-kaspi">
                <span class="icon">💛</span>
                <span class="label">Kaspi перевод</span>
                <span class="badge">+7 771 437 1241</span>
            </a>

        </div>

        <div class="qr-section">
            <div class="qr-title">📲 МОЙ QR-КОД</div>
            <div id="qrcode"></div>
            <div class="qr-hint">Отсканируй и открой сайт</div>
        </div>

        <div class="footer">Книзь создана для биограммщика</div>

    </div>

    <script>
        (function() {
            // ССЫЛКА НА ВАШ САЙТ
            const siteUrl = 'https://sanek123bbb12.github.io';

            const container = document.getElementById('qrcode');
            container.innerHTML = '';

            new QRCode(container, {
                text: siteUrl,
                width: 140,
                height: 140
            });
        })();
    </script>

</body>
  </html>
